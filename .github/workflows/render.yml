name: DDC Render
on:
  push:
    paths: ['jobs/**.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Tai clip va loi doc
        run: |
          set -e
          JOB=$(git show --pretty= --name-only ${{ github.sha }} | grep -E '^jobs/.*\.json$' | tail -n1)
          [ -f "$JOB" ] || JOB=$(ls -1 jobs/*.json | sort | tail -n1)
          echo "job: $JOB"
          python3 - "$JOB" <<'PY'
          import json,sys,pathlib as p,urllib.request as u
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          p.Path('w').mkdir(exist_ok=True)
          lines=[]
          for i,c in enumerate(j['clips']):
              if isinstance(c,dict) and c.get('image'):
                  u.urlretrieve(c['image'],'w/i%02d.jpg'%i)
                  lines.append('img i%02d.jpg %s %s'%(i,float(c.get('dur',5)),c.get('move','push_in')))
              else:
                  url=c['video'] if isinstance(c,dict) else c
                  u.urlretrieve(url,'w/c%02d.mp4'%i)
                  lines.append('vid c%02d.mp4'%i)
          p.Path('w/list.txt').write_text(chr(10).join(lines)+chr(10))
          if j.get('audio'): u.urlretrieve(j['audio'],'w/vo.mp3')
          elif j.get('vo_text'):
              p.Path('w/vo.txt').write_text(j['vo_text'],encoding='utf-8')
              p.Path('w/voice.txt').write_text(j.get('voice') or 'vi-VN-HoaiMyNeural')
          s={'9:16':'1080:1920','16:9':'1920:1080','1:1':'1080:1080'}[j.get('ratio','9:16')]
          p.Path('w/meta.sh').write_text('SIZE=%s\nN=%d\nNAME=%s\n'%(s,len(j['clips']),j['id']))
          PY
      - name: Cai ffmpeg va edge-tts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          pip install -q "edge-tts>=7.0"
      - name: Ghep va long tieng
        id: r
        run: |
          set -e
          . w/meta.sh
          W=${SIZE%%:*}; H=${SIZE##*:}
          cd w; : > l.txt
          i=0
          while read -r kind f d mv; do
            [ -n "$kind" ] || continue
            o=$(printf n%02d.mp4 $i)
            if [ "$kind" = "img" ]; then
              F=$(awk -v d="$d" 'BEGIN{printf "%d", d*30}')
              case "$mv" in
                pull_out)   Z="1.08-0.08*on/$F"; X="(iw-iw/zoom)/2"; Y="(ih-ih/zoom)/2" ;;
                tilt_up)    Z="1.08"; X="(iw-iw/zoom)/2"; Y="(ih-ih/zoom)*(1-on/$F)" ;;
                tilt_down)  Z="1.08"; X="(iw-iw/zoom)/2"; Y="(ih-ih/zoom)*on/$F" ;;
                pan_left)   Z="1.08"; X="(iw-iw/zoom)*(1-on/$F)"; Y="(ih-ih/zoom)/2" ;;
                pan_right)  Z="1.08"; X="(iw-iw/zoom)*on/$F"; Y="(ih-ih/zoom)/2" ;;
                *)          Z="1+0.08*on/$F"; X="(iw-iw/zoom)/2"; Y="(ih-ih/zoom)/2" ;;
              esac
              ffmpeg -nostdin -y -loop 1 -framerate 30 -i $f -vf "scale=$((W*4)):$((H*4)):force_original_aspect_ratio=increase:flags=lanczos,crop=$((W*4)):$((H*4)),zoompan=z='$Z':x='$X':y='$Y':d=1:s=${W}x${H}:fps=30,setsar=1,scale=out_range=tv,format=yuv420p" -frames:v $F -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -color_range tv -an $o
              echo "canh $((i+1)): anh tinh $mv ${d}s" >> $GITHUB_STEP_SUMMARY
            else
              ffmpeg -nostdin -y -i $f -vf "scale=$W:$H:force_original_aspect_ratio=decrease,pad=$W:$H:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -an $o
            fi
            echo "file '$o'" >> l.txt
            i=$((i+1))
          done < list.txt
          ffmpeg -y -f concat -safe 0 -i l.txt -c copy s.mp4
          VD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 s.mp4)
          if [ ! -f vo.mp3 ] && [ -f vo.txt ]; then
            VOICE=$(cat voice.txt)
            ok=0
            for t in 1 2 3; do edge-tts --voice "$VOICE" -f vo.txt --write-media vo0.mp3 && ok=1 && break; sleep 5; done
            [ "$ok" = "1" ] || { echo "LOI: khong sinh duoc giong $VOICE"; exit 1; }
            A0=$(ffprobe -v error -show_entries format=duration -of csv=p=0 vo0.mp3)
            RATE=$(awk -v a="$A0" -v v="$VD" 'BEGIN{t=v-0.5; r=(a/t-1)*100; if(r<-20)r=-20; if(r>10)r=10; printf "%+d", r}')
            ok=0
            for t in 1 2 3; do edge-tts --voice "$VOICE" --rate="${RATE}%" -f vo.txt --write-media vo.mp3 && ok=1 && break; sleep 5; done
            [ "$ok" = "1" ] || cp vo0.mp3 vo.mp3
            echo "giong $VOICE | doc tu nhien $A0 s | chinh toc do ${RATE}% cho vua $VD s hinh" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f vo.mp3 ] && [ ! -f vo.txt ]; then
            A0=$(ffprobe -v error -show_entries format=duration -of csv=p=0 vo.mp3)
            TEMPO=$(awk -v a="$A0" -v v="$VD" 'BEGIN{t=v-1.0; r=a/t; if(r>0.97 && r<1.0)r=1; if(r<0.92)r=0.92; if(r>1.15)r=1.15; printf "%.3f", r}')
            if [ "$TEMPO" != "1.000" ]; then
              ffmpeg -y -i vo.mp3 -af "atempo=$TEMPO" -c:a libmp3lame -b:a 192k vo_fit.mp3 && mv vo_fit.mp3 vo.mp3
            fi
            ffmpeg -y -i vo.mp3 -af "loudnorm=I=-16:TP=-1.5:LRA=11" -ar 44100 -c:a libmp3lame -b:a 192k vo_n.mp3 && mv vo_n.mp3 vo.mp3
            echo "giong file | goc $A0 s | chinh toc do x$TEMPO cho vua $VD s hinh | chuan hoa am luong -16 LUFS" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f vo.mp3 ]; then
            AD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 vo.mp3)
            PAD=$(awk -v a="$AD" -v v="$VD" 'BEGIN{d=a-v; if(d<0.05)d=0; printf "%.3f", d}')
            T=$(awk -v a="$AD" -v v="$VD" 'BEGIN{printf "%.3f", (a>v?a:v)}')
            echo "hinh $VD s | giong doc $AD s | keo dai hinh them $PAD s | video ra $T s" >> $GITHUB_STEP_SUMMARY
            if [ "$PAD" = "0.000" ]; then
              ffmpeg -y -i s.mp4 -i vo.mp3 -filter_complex "[1:a]apad=whole_dur=$T[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -t $T f.mp4
            else
              awk -v p="$PAD" 'BEGIN{if(p>2.0) print "CANH BAO: giong doc dai hon hinh hon 2 giay, canh cuoi bi dung hinh lau."}' >> $GITHUB_STEP_SUMMARY
              ffmpeg -y -i s.mp4 -i vo.mp3 -filter_complex "[0:v]tpad=stop_mode=clone:stop_duration=$PAD[v];[1:a]apad=whole_dur=$T[a]" -map "[v]" -map "[a]" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -t $T f.mp4
            fi
            FD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 f.mp4)
            awk -v f="$FD" -v v="$VD" 'BEGIN{ if (f < v-0.25) { print "LOI: video ra ("f"s) ngan hon tong hinh ("v"s), bi cat mat."; exit 1 } }'
            echo "video ra $FD s, giu du hinh" >> $GITHUB_STEP_SUMMARY
          else
            cp s.mp4 f.mp4
          fi
          cd ..; mkdir -p renders; cp w/f.mp4 "renders/$NAME.mp4"
          echo "out=renders/$NAME.mp4" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: {name: ddc-video, path: '${{ steps.r.outputs.out }}'}
      - name: Luu ket qua
        run: |
          set -e
          . w/meta.sh
          git config user.name ddc-render-bot
          git config user.email actions@github.com
          git add renders
          if git diff --cached --quiet; then echo "Khong co file moi de commit"; exit 0; fi
          git commit -m "render: $NAME"
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            echo "Push lan $i that bai, dong bo lai roi thu lai"
            git pull --rebase --autostash || true
          done
          if [ "$ok" != "1" ]; then echo "KHONG PUSH DUOC VIDEO LEN REPO"; exit 1; fi
          echo "Video: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/renders/$NAME.mp4" >> $GITHUB_STEP_SUMMARY
