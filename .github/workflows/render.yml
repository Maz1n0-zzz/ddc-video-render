name: DDC Render
on:
  push:
    paths: ['jobs/**.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Tai clip va voice
        run: |
          set -e
          JOB=$(git show --pretty= --name-only ${{ github.sha }} | grep -E '^jobs/.*\.json$' | tail -n1)
          [ -f "$JOB" ] || JOB=$(ls -1 jobs/*.json | sort | tail -n1)
          echo "job: $JOB"
          python3 - "$JOB" <<'PY'
          import json,sys,pathlib as p,urllib.request as u
          j=json.load(open(sys.argv[1],encoding='utf-8'))
          p.Path('w').mkdir(exist_ok=True)
          for i,c in enumerate(j['clips']): u.urlretrieve(c,'w/c%02d.mp4'%i)
          if j.get('audio'): u.urlretrieve(j['audio'],'w/vo.mp3')
          s={'9:16':'1080:1920','16:9':'1920:1080','1:1':'1080:1080'}[j.get('ratio','9:16')]
          p.Path('w/meta.sh').write_text('SIZE=%s\nN=%d\nNAME=%s\n'%(s,len(j['clips']),j['id']))
          PY
      - name: Cai ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Ghep va long tieng
        id: r
        run: |
          set -e
          . w/meta.sh
          W=${SIZE%%:*}; H=${SIZE##*:}
          cd w; : > l.txt
          for i in $(seq 0 $((N-1))); do
            f=$(printf c%02d.mp4 $i); o=$(printf n%02d.mp4 $i)
            ffmpeg -y -i $f -vf "scale=$W:$H:force_original_aspect_ratio=decrease,pad=$W:$H:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -an $o
            echo "file '$o'" >> l.txt
          done
          ffmpeg -y -f concat -safe 0 -i l.txt -c copy s.mp4
          if [ -f vo.mp3 ]; then ffmpeg -y -i s.mp4 -i vo.mp3 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest f.mp4; else cp s.mp4 f.mp4; fi
          cd ..; mkdir -p renders; cp w/f.mp4 "renders/$NAME.mp4"
          echo "out=renders/$NAME.mp4" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: {name: ddc-video, path: '${{ steps.r.outputs.out }}'}
      - name: Luu ket qua
        run: |
          . w/meta.sh
          git config user.name ddc-render-bot
          git config user.email actions@github.com
          git add renders && git commit -m "render: $NAME" && git push || echo "khong co gi de commit"
          echo "Video: renders/$NAME.mp4" >> $GITHUB_STEP_SUMMARY
